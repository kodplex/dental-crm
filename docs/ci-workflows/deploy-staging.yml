name: Deploy to Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging (Vercel)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.dentflow.ai
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: echo "Deploy to Vercel staging — configure VERCEL_TOKEN in repo secrets"
